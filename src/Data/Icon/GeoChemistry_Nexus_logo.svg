<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 560" width="1100" height="560">
  <title>GeoChemistry Nexus logo variants</title>
  <rect width="1100" height="560" fill="#ffffff"/>
  <!-- 1. original logo -->
  <image x="164" y="182" width="196" height="196" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
  <!-- 2. refined app icon -->
  <g transform="translate(420,182)">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4E5BC0"/><stop offset="1" stop-color="#2E3A86"/></linearGradient>
    <linearGradient id="ifa" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6EAFF"/></linearGradient>
    <linearGradient id="ifb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B8C2F2"/><stop offset="1" stop-color="#97A3E4"/></linearGradient>
    <linearGradient id="ifc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9DFFF"/><stop offset="1" stop-color="#BAC4F6"/></linearGradient>
    <filter id="ish" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#141c4a" flood-opacity=".28"/></filter>
  </defs>
  <rect x="0" y="0" width="196" height="196" rx="40" fill="url(#ibg)"/>
  <g stroke-linejoin="round" stroke-width="5" filter="url(#ish)">
    <polygon points="70,38 137,38 128,93 53,144 19,132 20,98" fill="url(#ifa)" stroke="url(#ifa)"/>
    <polygon points="152,37 175,105 160,120 141,94" fill="url(#ifb)" stroke="url(#ifb)"/>
    <polygon points="131,105 148,127 106,159 69,148" fill="url(#ifc)" stroke="url(#ifc)"/>
  </g>
</g>
  <!-- 3. mark for white backgrounds -->
  <g transform="translate(680,182) scale(1.5294) translate(-12,-30)">
  <defs>
    <linearGradient id="mfa" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4E5EC4"/><stop offset="1" stop-color="#404DA1"/></linearGradient>
    <linearGradient id="mfb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2C3880"/><stop offset="1" stop-color="#242E69"/></linearGradient>
    <linearGradient id="mfc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6E80E2"/><stop offset="1" stop-color="#5A69BA"/></linearGradient>
  </defs>
  <g stroke-linejoin="round" stroke-width="5">
    <polygon points="70,38 137,38 128,93 53,144 19,132 20,98" fill="url(#mfa)" stroke="url(#mfa)"/>
    <polygon points="152,37 175,105 160,120 141,94" fill="url(#mfb)" stroke="url(#mfb)"/>
    <polygon points="131,105 148,127 106,159 69,148" fill="url(#mfc)" stroke="url(#mfc)"/>
  </g>
</g>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#6b7392" text-anchor="middle">
    <text x="262" y="420">原版</text><text x="518" y="420">应用图标</text><text x="810" y="420">白底标识</text>
  </g>
</svg>